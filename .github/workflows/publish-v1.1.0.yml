name: Publish v1.1.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v1.1.0.yml"
      - "tools/finalize_release_v1_1_0.py"

permissions:
  contents: write
  checks: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Verify, tag, publish, and read back
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: python tools/finalize_release_v1_1_0.py
