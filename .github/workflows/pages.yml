name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/publish-v1.1.0.yml"
      - "tools/finalize_release_v1_1_0.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.repository.private == false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Production readback
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if html=$(curl --fail --silent --show-error --location --max-time 20 "$PAGE_URL"); then
              printf '%s' "$html" | grep -Fq 'Test the claim.'
              printf '%s' "$html" | grep -Fq 'Preserve the evidence.'
              curl --fail --silent --show-error --location --max-time 20 "${PAGE_URL}app.js" >/dev/null
              curl --fail --silent --show-error --location --max-time 20 "${PAGE_URL}styles.css" >/dev/null
              echo "PASS — production Pages readback: $PAGE_URL"
              exit 0
            fi
            sleep 5
          done
          echo 'FAIL — deployed Pages URL did not become readable within the bounded retry window' >&2
          exit 1
