name: Browser UAT

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "web/**"
      - "src/aitp/prediction.py"
      - "tools/browser_uat.py"
      - "tools/browser_uat_live.py"
      - ".github/workflows/browser-uat.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "web/**"
      - "src/aitp/prediction.py"
      - "tools/browser_uat.py"
      - "tools/browser_uat_live.py"
      - ".github/workflows/browser-uat.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install browser-UAT dependency
        run: python -m pip install --disable-pip-version-check playwright==1.64.1
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Rendered Chromium UAT
        run: python tools/browser_uat.py --chromium __playwright_managed__
      - name: Live HTTP Chromium UAT
        run: python tools/browser_uat_live.py --chromium __playwright_managed__
